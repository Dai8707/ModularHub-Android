# ModularHub 组件清单（项目根目录）
# 壳工程只维护集成配置；业务项目在独立 Git 仓，缺仓时由 Gradle Sync 自动 clone 到 modules/。
#
# 关键约定：
# - enabled：这条是否参与集成
# - mode=source：缺仓时自动拉到 modules/，方便改代码；不改成 project() 依赖
# - mode=aar：不拉仓库；依赖仍按 aar.version 走 Maven
# - 本地 / CI 打包一律使用带版本号的坐标，不用 implementation project(...)
#
# 本地联调：
#   1. ~/.gradle/gradle.properties 配置 gpr.user / gpr.token（见 docs/GITHUB_PACKAGES.md）
#   2. ./gradlew :app:assembleDebug   # source 缺仓会自动 clone
#   3. 改完源码后 ./gradlew publishModules
#   关闭自动拉：gradle.properties 写 modularHub.autoSync=false


defaults:
  mode: source
  git:
    ref: main
  maven:
    group_prefix: com.modularhub
    # 包挂在壳仓下；解析顺序：mavenLocal → 此仓库 → google / mavenCentral
    repository: "https://maven.pkg.github.com/Dai8707/ModularHub-Android"

profile: dev

profiles:
  personal:
    defaults:
      mode: source
  dev:
    defaults:
      mode: source
  staging:
    defaults:
      mode: aar
  release:
    defaults:
      mode: aar

modules:
  - name: feature-main
    type: feature
    enabled: true
    git:
      url: "git@github.com:Dai8707/project-main.git"
      ref: main
    source:
      path: modules/project-main/feature-main
      gradle_path: :feature-main
    aar:
      artifact: feature-main
      version: 1.0.0

  - name: feature-home
    type: feature
    enabled: true
    git:
      url: "git@github.com:Dai8707/project-home.git"
      ref: main
    source:
      path: modules/project-home/feature-home
      gradle_path: :feature-home
    aar:
      artifact: feature-home
      version: 1.0.0

  - name: feature-category
    type: feature
    enabled: true
    git:
      url: "git@github.com:Dai8707/project-category.git"
      ref: main
    source:
      path: modules/project-category/feature-category
      gradle_path: :feature-category
    aar:
      artifact: feature-category
      version: 1.0.0

  - name: feature-cart
    type: feature
    enabled: true
    git:
      url: "git@github.com:Dai8707/project-cart.git"
      ref: main
    source:
      path: modules/project-cart/feature-cart
      gradle_path: :feature-cart
    aar:
      artifact: feature-cart
      version: 1.0.0

  - name: feature-mine
    type: feature
    enabled: true
    git:
      url: "git@github.com:Dai8707/project-mine.git"
      ref: main
    source:
      path: modules/project-mine/feature-mine
      gradle_path: :feature-mine
    aar:
      artifact: feature-mine
      version: 1.0.0
