plugins {
    alias libs.plugins.android.application
    alias libs.plugins.kotlin.android
    id 'modularhub.deps'
}

android {
    namespace 'com.modularhub.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.modularhub.app'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

// ?? app ????????????????? com.modularhub:feature-main:<yaml.version>
modularHub {
    implementation 'feature-main'
}

dependencies {
    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.material
}

// Android Studio Gradle ??‰Øapp > Tasks > modularhub ?????????
['publishModules', 'listModules', 'validateModulesYaml'].each { taskName ->
    tasks.register(taskName) {
        group = 'modularhub'
        dependsOn rootProject.tasks.named(taskName)
    }
}

tasks.named('publishModules') {
    description = 'Publish source-mode modules to mavenLocal / GitHub Packages'
