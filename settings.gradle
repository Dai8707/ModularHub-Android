pluginManagement {
    includeBuild('build-logic')
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id 'modularhub.settings'
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        // modularhub.settings 还会追加 mavenLocal() 和 YAML 里的私服
        google()
        mavenCentral()
        mavenLocal()
    }
}

rootProject.name = 'ModularHub-Android'
include ':app'
